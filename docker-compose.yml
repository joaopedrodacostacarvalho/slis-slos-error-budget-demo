version: "3.8"

services:
  checkout:
    build: ./checkout
    ports:
      - "5000:5000"
    environment:
      - SHIPPING_URL=http://chaos-proxy:8080
      - OTEL_SERVICE_NAME=checkout                 # ← nome do serviço
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=demo
    depends_on:
      - chaos-proxy

  shipping:
    build: ./shipping
    ports:
      - "5001:5001"

  chaos-proxy:
    build: ./chaos-proxy
    ports:
      - "8080:8080"
    environment:
      - UPSTREAM_URL=http://shipping:5001
    depends_on:
      - shipping

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - checkout
      - shipping

  jaeger:
    image: jaegertracing/all-in-one:1.54
    ports:
      - "16686:16686"
      - "14250:14250"

  sloth-generate:
    image: slok/sloth:latest
    volumes:
      - ./sloth/slo.yaml:/slo.yaml
      - ./prometheus/rules:/output
    command: ["generate", "-i", "/slo.yaml", "-o", "/output/slo-rules.yaml"]

  prometheus:
    image: prom/prometheus:v2.50.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
      - alertmanager
      - sloth-generate

  alertmanager:
    image: prom/alertmanager:v0.26.0
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:10.2.3
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
